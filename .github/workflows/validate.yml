name: validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check (node --check, all .mjs)
        run: |
          for f in apifix.mjs lib/*.mjs tools/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Check catalog.json is up to date with catalog/
        run: node tools/build-catalog.mjs --check

      - name: Validate catalog (catalog/ + catalog.json)
        run: node tools/validate-catalog.mjs

      - name: Smoke test (list / match / emit)
        run: |
          node apifix.mjs --list > /dev/null
          node apifix.mjs deepseek-v4.1-flash > /dev/null
          node apifix.mjs claude-opus-5 --emit pi > /dev/null
          printf 'deepseek-v4.1-flash\ngpt-6-astra\nclaude-opus-5\n' > /tmp/ids.txt
          node apifix.mjs --match /tmp/ids.txt > /dev/null

      - name: Smoke test (fix)
        run: |
          cp tools/fixtures/opencode-broken.json /tmp/fix-oc.json
          cp tools/fixtures/pi-broken.json /tmp/fix-pi.json
          # dry-run 期望有差异（exit 1）且不写入
          node apifix.mjs fix /tmp/fix-oc.json --dry-run && exit 1 || test $? -eq 1
          node apifix.mjs fix /tmp/fix-pi.json --dry-run && exit 1 || test $? -eq 1
          # --yes 应用后 audit 复验应完全一致
          node apifix.mjs fix /tmp/fix-oc.json --yes --no-backup
          node apifix.mjs fix /tmp/fix-pi.json --yes --no-backup
          node apifix.mjs audit /tmp/fix-oc.json
          node apifix.mjs audit /tmp/fix-pi.json
