name: validate

on:
  # 只在 master 与 PR 上跑：功能分支推上去不再各自触发整套矩阵（省 Actions 分钟数）。
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 同一 ref 的新推送取消上一轮未完成的运行，避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # ubuntu 为主力；windows 与开发环境一致（路径/编码/原子写入行为需要守护）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # windows 上也用 bash（runner 自带 Git Bash），保证步骤语法两端一致
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # gpui-kit 0.9.1 的 gpui-pre 0.3.12 需要 std::hint::cold_path（1.93 stable 尚未稳定），
      # 与 rust-toolchain.toml 保持一致。
      - name: Set up Rust 1.99
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      # 缓存 target/ 与 cargo registry：gpui 依赖树很大，冷编译是分钟数的主要开销。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # GPUI 在 Linux 上走 X11 / Wayland，编译期需要对应的开发头文件
      - name: Install GPUI Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libfontconfig-dev libvulkan-dev

      - name: Rust format, test, and lint
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Check catalog.json is up to date with catalog/
        run: cargo run --quiet --locked -- catalog build --check

      - name: Validate catalog (catalog/ + catalog.json)
        run: cargo run --quiet --locked -- catalog validate

      # 冒烟 id 从 catalog 动态派生，避免数据演进（模型退役/改名）导致假红。
      # 先把 --list 落盘再取首两行，避免 head/grep -m1 触发 SIGPIPE（bash -o pipefail）。
      - name: Smoke test (list / match / emit)
        run: |
          cargo run --quiet --locked -- --list > "$RUNNER_TEMP/list.txt"
          FIRST=$(awk -F'  ·  ' 'NR==1 { print $2 }' "$RUNNER_TEMP/list.txt")
          SECOND=$(awk -F'  ·  ' 'NR==2 { print $2 }' "$RUNNER_TEMP/list.txt")
          echo "smoke ids: $FIRST / $SECOND"
          cargo run --quiet --locked -- "$FIRST" > /dev/null
          cargo run --quiet --locked -- "$SECOND" --emit pi -f > /dev/null
          cargo run --quiet --locked -- "$SECOND" --emit codex -f > /dev/null
          cargo run --quiet --locked -- "$SECOND" --emit claude-env -f > /dev/null
          cargo run --quiet --locked -- "$SECOND" --emit curl > /dev/null
          cargo run --quiet --locked -- "$SECOND" --emit sdk > /dev/null
          printf '%s\n%s\n' "$FIRST" "$SECOND" > "$RUNNER_TEMP/ids.txt"
          cargo run --quiet --locked -- --match "$RUNNER_TEMP/ids.txt" > /dev/null
          cargo run --quiet --locked -- search qwen > /dev/null
          cargo run --quiet --locked -- compare "$FIRST" "$SECOND" > /dev/null

      # 配置审计：fixtures 均为假 key（sk-TEST），不会触碰真实用户配置
      - name: Smoke test (audit)
        run: |
          cargo run --quiet --locked -- audit tools/fixtures/opencode-broken.json > /dev/null
          cargo run --quiet --locked -- audit tools/fixtures/pi-broken.json > /dev/null
          cargo run --quiet --locked -- audit tools/fixtures/codex-broken.toml > /dev/null
          cargo run --quiet --locked -- audit tools/fixtures/claude-broken.json > /dev/null
