<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="apifix — 输入模型 id（支持中转/别名写法），查看官网规格与 opencode / pi 配置片段。" />
<title>apifix — 模型官网参数速查</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<a class="skip-link" href="#list">跳到模型列表</a>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 14.5 6.4 5.5l3.1 6 3.1-6 3.1 6 1.8-3.6" />
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">apifix</span>
        <span class="brand-sub">模型官网参数速查 · 中转 id 矫正</span>
      </span>
    </div>

    <nav class="tabs" id="tabs" aria-label="视图切换">
      <button class="tab is-active" type="button" data-view="lookup" aria-selected="true">单条查询</button>
      <button class="tab" type="button" data-view="batch" aria-selected="false">批量解析</button>
    </nav>

    <p class="topbar-meta" id="catalog-meta">加载中…</p>
  </div>
</header>

<main class="layout" id="view-lookup">

  <aside class="rail" id="rail" aria-label="筛选">
    <div class="rail-head">
      <div class="search">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="6.8" cy="6.8" r="4.3" /><path d="M10.2 10.2 14 14" />
          </svg>
        </span>
        <input id="search" type="search" placeholder="输入模型 ID 或中转 ID…" aria-label="搜索模型 ID"
               autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
        <button class="icon-btn search-clear" id="search-clear" type="button" aria-label="清空搜索" hidden>
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </div>
      <p class="rail-hint">支持别名、旧版 id、厂商前缀与中转后缀（-free / -preview / -latest…）</p>
      <p class="notice" id="core-notice" hidden></p>
      <button class="icon-btn rail-close" id="rail-close" type="button" aria-label="关闭筛选">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 4l8 8M12 4l-8 8" />
        </svg>
      </button>
    </div>

    <div class="rail-scroll">
      <section class="rail-block">
        <h2 class="rail-title">生命周期</h2>
        <div class="chips" id="lifecycle-chips"></div>
      </section>

      <section class="rail-block">
        <div class="rail-title-row">
          <h2 class="rail-title">厂商</h2>
          <span class="rail-count" id="vendor-count"></span>
        </div>
        <ul class="vendor-list" id="vendor-list"></ul>
      </section>

      <section class="rail-block">
        <label class="toggle" for="verified-only">
          <input type="checkbox" id="verified-only" />
          <span class="toggle-track" aria-hidden="true"></span>
          <span class="toggle-label">仅已核验</span>
          <span class="toggle-count" id="verified-count"></span>
        </label>
      </section>

      <p class="rail-foot">键盘 <kbd>↑</kbd> <kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 查看 · <kbd>/</kbd> 搜索</p>
    </div>
  </aside>

  <section class="list-pane" aria-label="模型列表">
    <div class="list-head">
      <button class="icon-btn filter-toggle" id="rail-open" type="button" aria-label="打开筛选">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M2.5 4.5h11M4.5 8h7M6.5 11.5h3" />
        </svg>
      </button>
      <div class="list-head-main">
        <h2 class="list-title">模型列表</h2>
        <p class="list-meta" id="result-count" aria-live="polite">加载中…</p>
      </div>
      <p class="kbd-hint"><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>Enter</kbd> 查看</p>
    </div>

    <div class="match-slot" id="match-slot"></div>

    <div class="list-scroll" id="list" role="region" aria-label="模型列表" tabindex="0"></div>
  </section>

  <aside class="detail-pane" id="detail-pane" aria-label="模型详情">
    <div class="detail-head">
      <span class="detail-kicker">模型详情</span>
      <button class="icon-btn detail-close" id="detail-close" type="button" aria-label="关闭详情">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 4l8 8M12 4l-8 8" />
        </svg>
      </button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </aside>

</main>

<main class="batch" id="view-batch" hidden>
  <div class="batch-inner">
    <header class="batch-head">
      <h2 class="batch-title">批量解析</h2>
      <p class="batch-desc">
        每行一个模型 id（支持中转 / 别名写法），逐行给出规范 id 与结论，等价于命令行
        <code>node apifix.mjs --match ids.txt</code>。
      </p>
    </header>

    <div class="batch-form">
      <label class="sr-only" for="batch-input">模型 id 列表</label>
      <textarea id="batch-input" class="batch-textarea" spellcheck="false" autocapitalize="off"
        placeholder="deepseek-v4.1-flash&#10;claude-opus-5&#10;glm-5-3-flash&#10;gpt-5.2-2025-12-11&#10;muse-spark-1.2-contributor-free"></textarea>
      <div class="batch-actions">
        <button class="btn btn-primary" id="batch-run" type="button">解析</button>
        <button class="btn" id="batch-example" type="button">填入示例</button>
        <button class="btn" id="batch-copy" type="button" disabled>
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" /><path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5V9A1.5 1.5 0 0 0 4 10.5h1.5" />
            </svg>
          </span>
          <span class="btn-label">复制全部结果</span>
        </button>
        <button class="btn btn-ghost" id="batch-clear" type="button">清空</button>
        <span class="batch-meta" id="batch-meta"></span>
      </div>
    </div>

    <div class="batch-result" id="batch-result"></div>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <p class="noscript">本页需要启用 JavaScript 才能查询模型规格。</p>
</noscript>

<script type="module" src="./app.js"></script>
</body>
</html>
